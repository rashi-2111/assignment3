<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
<div class="center-box">
  <div class="card">
    <h3>Register</h3>

    <form action="index.html">
      <input class="form-control mb-3" placeholder="Full Name">
      <input type="email"   class="form-control mb-3" placeholder="Email">
      <input type="number" class="form-control mb-3" placeholder="Phone Number">
      <input type="password" class="form-control mb-3" placeholder="Password">
      <input type="password" class="form-control mb-3" placeholder="Confirm Password">
      <button class="btn btn-custom w-100" type="submit">Register</button>
    </form>
    <div class="text-center mt-3">
     <p>Already have an account?</p>
     <p><a href="index.html">Login</a></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
